name: Werk trendhistorie bij

on:
  schedule:
    - cron: "*/30 * * * *" # elke 30 minuten
  workflow_dispatch:

permissions:
  contents: write # om de data-branch (trendhistorie) bij te werken

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout bestaande trendhistorie (data-branch, indien aanwezig)
        uses: actions/checkout@v4
        with:
          ref: data
          path: repo-data
        continue-on-error: true

      - name: Historie terugzetten
        run: |
          mkdir -p repo/data
          if [ -f repo-data/history.sqlite ]; then
            cp repo-data/history.sqlite repo/data/history.sqlite
            echo "Bestaande historie teruggezet."
          else
            echo "Geen bestaande historie gevonden, start leeg (eerste run of data-branch bestaat nog niet)."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        working-directory: repo
        run: pip install -r requirements.txt

      - name: Voer checks uit en sla snapshot op
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/record_history.py

      - name: Historie wegschrijven naar data-branch
        run: |
          rm -rf repo-data
          mkdir -p repo-data
          cp repo/data/history.sqlite repo-data/history.sqlite
          cd repo-data
          git init -q
          git checkout -q -B data
          git config user.name "cockpit-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add history.sqlite
          git commit -q -m "Update trendhistorie" || echo "Geen wijzigingen in historie."
          git push -q -f origin data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
