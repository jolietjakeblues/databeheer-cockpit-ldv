<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Databeheer Cockpit LDV{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ 'style.css' if static else '/static/style.css' }}">
</head>
<body>
    <header>
        <span class="eyebrow">LDV · Rijksdienst voor het Cultureel Erfgoed</span>
        <h1>Databeheer Cockpit</h1>
        <p class="subtitle">Diensten, pipelines en datakwaliteit van de Linked Data Voorziening in één overzicht</p>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
