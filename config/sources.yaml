# Configuratie van alle bronnen die de cockpit bewaakt.
# Uitbreiden = hier een item toevoegen, geen codewijziging nodig.

ldv_services:
  - name: datacatalog:virtuoso
    url: https://api.linkeddata.cultureelerfgoed.nl/datasets/rce/datacatalog/services/datacatalog
  - name: cho:virtuoso
    url: https://api.linkeddata.cultureelerfgoed.nl/datasets/rce/cho/services/cho/
  - name: cht-jena:jena
    url: https://api.linkeddata.cultureelerfgoed.nl/datasets/thesauri/cht/services/cht-jena/
  - name: cht-virtuoso:virtuoso
    url: https://api.linkeddata.cultureelerfgoed.nl/datasets/thesauri/cht/services/cht-virtuoso/
  - name: archeologischbasisregister-jena:jena
    url: https://api.linkeddata.cultureelerfgoed.nl/datasets/thesauri/archeologischbasisregister/services/archeologischbasisregister-jena/

websites:
  - name: Homepage Kennisbank RCE
    url: https://kennis.cultureelerfgoed.nl/
  - name: Datasets op Kennisbank RCE
    url: https://kennis.cultureelerfgoed.nl/index.php/Datasets_van_de_RCE
  - name: Beeldbank RCE
    url: https://beeldbank.cultureelerfgoed.nl/
  - name: Homepage RCE
    url: https://www.cultureelerfgoed.nl/

# GitHub Actions workflows die het LDV-databeheer draaiend houden.
# cadence_days = verwachte cron-cadans, uitgelezen uit elke workflow (`on.schedule.cron`).
# null = geen cron (workflow_dispatch-only), dan wordt alleen de laatste conclusie getoond,
# geen "te lang geleden gedraaid"-check.
pipelines:
  - repo: cultureelerfgoed/rce-thesauri-backup
    workflow: cht-backup-poolparty.yml
    label: "Thesauri Backup - CHT (PoolParty)"
    cadence_days: 1
  - repo: cultureelerfgoed/rce-thesauri-backup
    workflow: abr-backup-poolparty.yml
    label: "Thesauri Backup - ABR (PoolParty)"
    cadence_days: 1
  - repo: cultureelerfgoed/rce-thesauri-backup
    workflow: wo2-thesaurus-backup-poolparty.yml
    label: "Thesauri Backup - WO2"
    cadence_days: 1
  - repo: cultureelerfgoed/rce-thesauri-backup
    workflow: rn-backup-poolparty.yml
    label: "Thesauri Backup - Referentie Netwerk"
    cadence_days: 1
  - repo: cultureelerfgoed/rce-thesauri-backup
    workflow: rn2-backup-poolparty.yml
    label: "Thesauri Backup - Referentie Netwerk 2"
    cadence_days: 1
  - repo: cultureelerfgoed/rce-thesauri-backup
    workflow: cht-kennisbank-poolparty.yml
    label: "Thesauri Backup - CHT concepts voor Kennisbank"
    cadence_days: 1
  - repo: cultureelerfgoed/rce-thesauri-backup
    workflow: ldv-cho-count.yml
    label: "Dagelijkse triple-telling LDV CHO"
    cadence_days: 1
  - repo: cultureelerfgoed/thesauri-poolparty-ldv
    workflow: deploy.yml
    label: "Deploy Thesauri PoolParty naar TriplyDB"
    cadence_days: 1
  - repo: cultureelerfgoed/workflow-rijksmonumenten-sdo-termennetwerk
    workflow: schemaorg-pipeline.yml
    label: "Rijksmonumenten SDO pipeline"
    cadence_days: 1
  - repo: cultureelerfgoed/tooi
    workflow: tooi-sync.yml
    label: "TOOI maandelijkse sync"
    cadence_days: 31
  - repo: cultureelerfgoed/datacatalog-etl
    workflow: push_latest_datacatalog.yml
    label: "Datacatalog dagelijkse ETL"
    cadence_days: 1
  - repo: cultureelerfgoed/muurschilderingendatabase-etl
    workflow: muurschilderingendatabase-etl.yml
    label: "Muurschilderingendatabase wekelijkse ETL"
    cadence_days: 7
  - repo: cultureelerfgoed/kunstcollecties-etl
    workflow: stateful_harvest_kunstcollecties.yml
    label: "Kunstcollecties ETL"
    cadence_days: null # alleen workflow_dispatch, geen cron
  - repo: jolietjakeblues/databeheer-cockpit-ldv
    workflow: record-history.yml
    label: "Cockpit - historie-Action (bewaakt zichzelf)"
    cadence_days: 1 # cron elke 30 min; 3 dagen stilte = uitgeschakeld/vastgelopen
  - repo: cultureelerfgoed/cho-diff-monitor
    workflow: daily.yml
    label: "CHO diff - dagelijks"
    cadence_days: 1 # cron 07:00 UTC
  - repo: cultureelerfgoed/cho-diff-monitor
    workflow: weekly.yml
    label: "CHO diff - wekelijks"
    cadence_days: 7 # cron maandag 09:00 UTC

# SPARQL-endpoints voor de datacatalog<->NDE cross-check (publiek, geen token nodig).
sparql_endpoints:
  datacatalog_rce: https://api.linkeddata.cultureelerfgoed.nl/datasets/rce/datacatalog/services/datacatalog/sparql
  nde_datasetregister: https://datasetregister.netwerkdigitaalerfgoed.nl/sparql

# TriplyDB-datasets: per dataset triple count, laatste update en TriplyDB's
# eigen hasDataQualityIssues-vlag, via https://api.linkeddata.cultureelerfgoed.nl/datasets/{account}/{dataset}
# Optioneel per dataset: max_age_days (alarm als de dataset langer dan dit niet is bijgewerkt) en
# max_drop_pct (alarm bij een daling van minstens dit % t.o.v. de vorige meting; standaard 5,
# null = uit; datasets onder 1000 triples worden niet getoetst).
triplydb_datasets:
  - account: rce
    dataset: cho
    label: "CHO - Cultuurhistorische Objecten"
    max_age_days: 3 # dagelijkse verwerking
  - account: rce
    dataset: cho-acceptance
    label: "CHO (acceptance)"
    max_drop_pct: null # acceptatie-omgeving mag schommelen
  - account: rce
    dataset: datacatalog
    label: "Datacatalog"
    max_age_days: 3 # dagelijkse ETL
  - account: rce
    dataset: ceo
    label: "CEO - Cultureel Erfgoed Ontologie"
  - account: rce
    dataset: Rijksmonumenten-sdo
    label: "Rijksmonumenten SDO"
    max_age_days: 3 # dagelijkse pipeline
  - account: rce
    dataset: rijkscollectie-rce
    label: "Rijkscollectie RCE"
  - account: rce
    dataset: tooi
    label: "TOOI"
    max_age_days: 40 # maandelijkse sync (1e van de maand)
  - account: rce
    dataset: Muurschilderingen
    label: "Muurschilderingen"
    max_age_days: 10 # wekelijkse ETL
  - account: thesauri
    dataset: cht
    label: "CHT - Cultuurhistorische Thesaurus"
    max_age_days: 3 # dagelijkse deploy
  - account: thesauri
    dataset: Cultuurhistorische-Thesaurus-CHT
    label: "Erfgoedthesaurus (CHT, volledig)"
    max_age_days: 3
  - account: thesauri
    dataset: archeologischbasisregister
    label: "Archeologisch Basisregister (ABR)"
    max_age_days: 3
  - account: thesauri
    dataset: referentienetwerk
    label: "Referentienetwerk"
    max_age_days: 3
  - account: thesauri
    dataset: thesauri
    label: "Thesauri (overkoepelend)"
    max_age_days: 3

# PoolParty: per omgeving een set tests (zie app/checks/poolparty.py).
# Credentials komen uit de omgeving: *_USER + *_TOKEN (aanbevolen), of alleen
# *_TOKEN met een kant-en-klare base64-waarde van "gebruiker:wachtwoord".
poolparty:
  slow_seconds: 10 # langzamer dan dit = waarschuwing, ook als het antwoord klopt
  environments:
    - name: productie
      host: https://digitaalerfgoed.poolparty.biz
      public_host: https://data.cultureelerfgoed.nl # waar de extractor publiek draait
      user_env: POOLPARTY_USER
      token_env: POOLPARTY_TOKEN
      project_id: 1DF17ED4-4A38-0001-C6FF-883013B04AD0 # Cultuurhistorische Thesaurus
      concept_uri: https://data.cultureelerfgoed.nl/term/id/cht/1b8bd4e8-d51c-4ae2-8c16-c56751e2c470
      suggest_term: gotiek
      suggest_language: nl
      # Elk project hier krijgt een eigen testregel: bestaat, heeft schemes en topconcepten.
      expected_projects:
        - { id: 1DF17ED4-4A38-0001-C6FF-883013B04AD0, label: "CHT" }
        - { id: 1bfbc515-5bee-4c49-86aa-fb03c8ee3667, label: "ABR v2" }
        - { id: f475b9b7-177b-430f-b7eb-5ccc2420ad69, label: "Referentie Netwerk v2" }
        - { id: 1E267A03-76FD-0001-F681-567064301637, label: "PAN" }
    - name: test
      host: https://digitaalerfgoed-test.poolparty.biz
      user_env: POOLPARTY_USER_TEST
      token_env: POOLPARTY_TOKEN_TEST
      project_id: 312d0e18-773b-45eb-95ff-51a94d760967
      concept_uri: https://digitaalerfgoed-test.poolparty.biz/term/id/cht/9f841236-c0d0-4583-bfab-b2e8ddcf8fec
      suggest_term: gotiek
      suggest_language: nl
      expected_projects:
        - { id: 312d0e18-773b-45eb-95ff-51a94d760967, label: "CHT (test)" }
        - { id: 6d635ec4-714d-4d58-b51f-a0fb84b9fcbb, label: "Referentie Netwerk 2 (test)" }

# Alerts (ntfy) vanuit scripts/record_history.py, naast "nieuwe FAIL".
alerts:
  # Zoveel checks tegelijk onbeoordeelbaar (grijs) = de cockpit is blind (verlopen token,
  # verkeerde credentials, netwerk) en meldt dat zelf. Niet geconfigureerde checks
  # ("... ontbreekt, check overgeslagen") en gemute checks tellen niet mee.
  unknown_threshold: 5

# Bekende, geaccepteerde problemen: een check die hier op label matcht en
# FAIL/WARNING oplevert wordt teruggebracht naar UNKNOWN met de reden erbij.
# `until` (optioneel, YYYY-MM-DD) laat de mute vanzelf verlopen.
mutes:
  - label: "Rijkscollectie RCE"
    reason: "bewust nog niet publiek toegankelijk"
  - label: "CHO diff - wekelijks"
    reason: "weekoverzicht-mail nog in aanpassing, run van ma 23-11 mislukt"
    until: "2026-11-30"

refresh_interval_seconds: 300
